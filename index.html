<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mecklenburg Intel — Phase 1</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --panel: #0F172A;
      --accent: #3B82F6;
      --accent-soft: #60A5FA;
      --text: #E5E7EB;
      --muted: #1F2937;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 28px; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    .tag { color: var(--accent-soft); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .panel { background: var(--panel); border: 1px solid var(--muted); border-radius: 8px; padding: 24px; margin-top: 24px; }
    .panel h2 { margin: 0 0 12px 0; font-size: 16px; color: var(--accent-soft); }
    p { line-height: 1.55; }
    code { background: var(--muted); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">Mecklenburg Intel</div>
    <h1>Phase 1 — Reconnaissance</h1>
    <div class="panel">
      <h2>Status</h2>
      <p>Project scaffold only. No data wired up yet.</p>
      <p>See <code>RECON.md</code> for source inventory and the NC-adapted distress pattern stack.</p>
    </div>
  </div>
</body>
</html>
